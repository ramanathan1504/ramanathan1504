plugins {
    id 'java'
    id 'application'
    id 'com.github.johnrengelman.shadow' version '7.1.2' // For creating the "fat JAR"
}

group = 'com.githubeventstojira'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    // HTTP Client and JSON Processing
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.1'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.17.1'  
    implementation 'org.apache.logging.log4j:log4j-core:2.25.0'
    // Command-Line Argument Parsing
    implementation 'info.picocli:picocli:4.7.6'
    annotationProcessor 'info.picocli:picocli-codegen:4.7.6'

    // Logging Framework
    implementation 'org.slf4j:slf4j-api:2.0.13'
    runtimeOnly 'ch.qos.logback:logback-classic:1.5.6'
}

application {
    mainClass = 'com.githubeventstojira.App'
}

shadowJar {
    archiveBaseName = 'github-jira-monitor'
    archiveClassifier = 'all'
    archiveVersion = '1.0.0'
}

// Ensure Picocli annotation processing works with Gradle
compileJava {
    options.compilerArgs += '-Aproject=' + project.group + '/' + project.name
}