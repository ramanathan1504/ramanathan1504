name: GitHub JIRA Specific Issues/PRs Migration

on:
  workflow_dispatch:
    inputs:
      issues:
        description: 'Issue/PR list (comma-separated, e.g., kubernetes/kubernetes#1650,docker/docker#123,owner/repo#456)'
        required: true
        default: 'kubernetes/kubernetes#1650,jreleaser/jreleaser#1933,jreleaser/jreleaser#1939'
      dry_run:
        description: 'Dry run mode (true/false)'
        required: false
        default: 'true'

env:
  GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
  JIRA_AUTH: ${{ secrets.JIRA_AUTH }}

jobs:
  old-issue-migrate:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests
        
    - name: Run Old Issue Migration
      run: |
        cd scripts
        ISSUES="${{ github.event.inputs.issues }}"
        DRY_RUN="${{ github.event.inputs.dry_run }}"
        
        if [ "$DRY_RUN" = "true" ]; then
          python github_jira_monitor.py old-issue --issues "$ISSUES" --dry-run
        else
          python github_jira_monitor.py old-issue --issues "$ISSUES"
        fi
