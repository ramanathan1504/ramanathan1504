name: Migrate All GitHub Comments to JIRA (Manual)

on:
  workflow_dispatch:  # Manual trigger only
    inputs:
      max_pages:
        description: 'Maximum pages to process (each page = 100 events)'
        required: false
        default: '10'
        type: string
      dry_run:
        description: 'Dry run (show what would be processed without creating JIRA tasks)'
        required: false
        default: false
        type: boolean

jobs:
  migrate-all-comments:
    runs-on: ubuntu-latest
    steps:
      - name: Migrate All Historical Comments
        run: |
          set -e  # Exit on any error
          
          echo "=== Starting GitHub Comments Migration ==="
          echo "Timestamp: $(date)"
          echo ""
          echo "=== Configuration Details ==="
          echo "GitHub User: ramanathan1504"
          echo "Organization to skip: intemo_dev"
          echo "JIRA Domain: osscontribution.atlassian.net"
          echo "JIRA Project: OT"
          echo "Max Pages: ${{ github.event.inputs.max_pages }}"
          echo "Dry Run: ${{ github.event.inputs.dry_run }}"
          echo "GitHub Token: $(echo ${{ secrets.GH_TOKEN }} | head -c 10)..." 
          echo "JIRA Auth: $(echo ${{ secrets.JIRA_AUTH }} | head -c 20)..."
          echo ""
          
          MAX_PAGES=${{ github.event.inputs.max_pages }}
          DRY_RUN=${{ github.event.inputs.dry_run }}
          TOTAL_PROCESSED=0
          TOTAL_CREATED=0
          TOTAL_SKIPPED=0
          TOTAL_ERRORS=0
          
          # Process multiple pages of events
          for page in $(seq 1 $MAX_PAGES); do
            echo "=== Processing Page $page/$MAX_PAGES ==="
            
            # Get events from this page
            echo "Fetching GitHub events page $page..."
            EVENTS=$(curl -s -f -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
              "https://api.github.com/users/ramanathan1504/events?per_page=100&page=$page")
            
            if [ $? -ne 0 ]; then
              echo "ERROR: Failed to fetch GitHub events for page $page"
              break
            fi
            
            # Check if we got valid JSON
            EVENTS_COUNT=$(echo "$EVENTS" | jq '. | length' 2>/dev/null || echo "0")
            echo "Events found on page $page: $EVENTS_COUNT"
            
            if [ "$EVENTS_COUNT" = "0" ]; then
              echo "No more events found. Stopping pagination."
              break
            fi
            
            # Process each IssueCommentEvent on this page
            COMMENT_EVENTS=$(echo "$EVENTS" | jq -r '.[] | select(.type == "IssueCommentEvent") | 
              {
                repo: .repo.full_name,
                repo_owner: .repo.owner.login,
                is_fork: .repo.fork,
                comment_body: .payload.comment.body,
                issue_url: .payload.issue.html_url,
                issue_title: .payload.issue.title,
                created_at: .created_at
              }' 2>/dev/null)
            
            if [ -z "$COMMENT_EVENTS" ]; then
              echo "No comment events found on page $page"
              continue
            fi
            
            echo "Processing comment events from page $page..."
            
            echo "$COMMENT_EVENTS" | while IFS= read -r event; do
              
              if [ -n "$event" ]; then
                echo ""
                echo "--- Processing Historical Comment Event ---"
                
                REPO_OWNER=$(echo "$event" | jq -r '.repo_owner')
                IS_FORK=$(echo "$event" | jq -r '.is_fork')
                COMMENT_BODY=$(echo "$event" | jq -r '.comment_body')
                ISSUE_URL=$(echo "$event" | jq -r '.issue_url')
                ISSUE_TITLE=$(echo "$event" | jq -r '.issue_title')
                REPO_NAME=$(echo "$event" | jq -r '.repo')
                CREATED_AT=$(echo "$event" | jq -r '.created_at')
                
                echo "Repository: $REPO_NAME"
                echo "Owner: $REPO_OWNER"
                echo "Issue: $ISSUE_TITLE"
                echo "URL: $ISSUE_URL"
                echo "Date: $CREATED_AT"
                echo "Comment preview: $(echo "$COMMENT_BODY" | head -c 100)..."
                
                TOTAL_PROCESSED=$((TOTAL_PROCESSED + 1))
                
                # Skip if it's your own repo or your org repo
                if [ "$REPO_OWNER" = "ramanathan1504" ] || [ "$REPO_OWNER" = "intemo_dev" ]; then
                  echo "✅ SKIPPED: Own/org repo - $REPO_NAME"
                  TOTAL_SKIPPED=$((TOTAL_SKIPPED + 1))
                  continue
                fi
                
                echo "✅ EXTERNAL REPO: Processing comment on $REPO_NAME"
                
                # Check if I have forked this repo to determine the JIRA task type
                REPO_NAME_ONLY=$(echo "$REPO_NAME" | cut -d'/' -f2)
                echo "Checking if I have forked: $REPO_NAME_ONLY"
                
                MY_FORK_CHECK=$(curl -s -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
                  "https://api.github.com/repos/ramanathan1504/$REPO_NAME_ONLY" 2>/dev/null | jq -r '.fork // false')
                
                if [ $? -ne 0 ]; then
                  echo "⚠️  WARNING: Could not check fork status, assuming no fork exists"
                  MY_FORK_CHECK="false"
                fi
                
                if [ "$MY_FORK_CHECK" = "true" ]; then
                  TASK_TYPE="contribution"
                  LABELS="[\"github-forked\", \"contribution\"]"
                  DESCRIPTION_PREFIX="Comment on Forked Repo (I have a fork):"
                  echo "🔄 FORK DETECTED: I have forked this repo - treating as CONTRIBUTION"
                else
                  TASK_TYPE="discussion"
                  LABELS="[\"github-discussion\", \"external-repo\"]"
                  DESCRIPTION_PREFIX="Discussion Comment on External Repo:"
                  echo "💬 NO FORK: Treating as DISCUSSION"
                fi
                
                if [ "$DRY_RUN" = "true" ]; then
                  echo "🧪 DRY RUN: Would create $TASK_TYPE JIRA task for: $ISSUE_TITLE"
                  TOTAL_CREATED=$((TOTAL_CREATED + 1))
                  continue
                fi
                
                # Check if JIRA task already exists for this GitHub issue
                echo "Searching for existing JIRA task..."
                SEARCH_JQL="project = OT AND summary ~ \"$ISSUE_URL\""
                EXISTING_ISSUE=$(curl -s -X GET \
                  -H "Authorization: Basic ${{ secrets.JIRA_AUTH }}" \
                  -H "Content-Type: application/json" \
                  "https://osscontribution.atlassian.net/rest/api/2/search?jql=$(echo "$SEARCH_JQL" | sed 's/ /%20/g')" 2>/dev/null)
                
                if [ $? -ne 0 ]; then
                  echo "❌ ERROR: Failed to search JIRA for existing tasks"
                  TOTAL_ERRORS=$((TOTAL_ERRORS + 1))
                  continue
                fi
                
                EXISTING_KEY=$(echo "$EXISTING_ISSUE" | jq -r '.issues[0].key // empty' 2>/dev/null)
                
                if [ -n "$EXISTING_KEY" ] && [ "$EXISTING_KEY" != "null" ]; then
                  echo "⚠️  ALREADY EXISTS: JIRA task already exists: $EXISTING_KEY"
                  TOTAL_SKIPPED=$((TOTAL_SKIPPED + 1))
                else
                  echo "📝 CREATE: Creating new $TASK_TYPE task for historical comment"
                  
                  # Get the issue details to use issue description instead of comment
                  ISSUE_API_URL=$(echo "$ISSUE_URL" | sed 's|github.com|api.github.com/repos|' | sed 's|/issues/|/issues/|')
                  ISSUE_DETAILS=$(curl -s -H "Authorization: token ${{ secrets.GH_TOKEN }}" "$ISSUE_API_URL" 2>/dev/null)
                  
                  if [ $? -eq 0 ] && [ -n "$ISSUE_DETAILS" ]; then
                    ISSUE_NUMBER=$(echo "$ISSUE_DETAILS" | jq -r '.number // "unknown"')
                    ISSUE_BODY=$(echo "$ISSUE_DETAILS" | jq -r '.body // "No description available"')
                    TASK_SUMMARY="$ISSUE_NUMBER - $ISSUE_TITLE"
                    TASK_DESCRIPTION="$DESCRIPTION_PREFIX\n\nIssue Description:\n$ISSUE_BODY\n\nMy Comment:\n$COMMENT_BODY\n\nGitHub Issue: $ISSUE_URL\nRepo: $REPO_NAME\nOriginal Date: $CREATED_AT"
                  else
                    # Fallback if we can't get issue details
                    TASK_SUMMARY="GitHub comment by ramanathan1504 on: $ISSUE_TITLE"
                    TASK_DESCRIPTION="$DESCRIPTION_PREFIX\n$COMMENT_BODY\n\nGitHub Issue: $ISSUE_URL\n\nRepo: $REPO_NAME\n\nOriginal Date: $CREATED_AT"
                  fi
                  
                  CREATE_RESPONSE=$(curl -s -X POST \
                    -H "Authorization: Basic ${{ secrets.JIRA_AUTH }}" \
                    -H "Content-Type: application/json" \
                    --data "{
                      \"fields\": {
                        \"project\": { \"key\": \"OT\" },
                        \"summary\": \"$TASK_SUMMARY\",
                        \"description\": \"$TASK_DESCRIPTION\",
                        \"issuetype\": { \"name\": \"Task\" },
                        \"labels\": $LABELS
                      }
                    }" \
                    "https://osscontribution.atlassian.net/rest/api/2/issue" 2>/dev/null)
                  
                  if [ $? -eq 0 ]; then
                    NEW_KEY=$(echo "$CREATE_RESPONSE" | jq -r '.key // "unknown"')
                    echo "✅ SUCCESS: Created new $TASK_TYPE JIRA task: $NEW_KEY"
                    TOTAL_CREATED=$((TOTAL_CREATED + 1))
                  else
                    echo "❌ ERROR: Failed to create JIRA task"
                    echo "Response: $CREATE_RESPONSE"
                    TOTAL_ERRORS=$((TOTAL_ERRORS + 1))
                  fi
                fi
                
                # Add a small delay to avoid rate limiting
                sleep 1
              fi
            done
            
            echo ""
            echo "Completed page $page. Continuing to next page..."
            sleep 2  # Delay between pages
          done
          
          echo ""
          echo "=== Migration Summary ==="
          echo "Total Comments Processed: $TOTAL_PROCESSED"
          echo "JIRA Tasks Created: $TOTAL_CREATED"
          echo "Skipped (own/org/existing): $TOTAL_SKIPPED"
          echo "Errors: $TOTAL_ERRORS"
          echo ""
          echo "=== GitHub Comments Migration Completed ==="
          echo "Timestamp: $(date)"
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          JIRA_AUTH: ${{ secrets.JIRA_AUTH }}
