name: GitHub JIRA PR Migration (Specific or Scan)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Migration mode'
        required: true
        type: choice
        options:
        - 'specific-prs'
        - 'repo-scan'
        default: 'specific-prs'
      specific_prs:
        description: 'Specific PR numbers (comma-separated, e.g., owner/repo#123,owner/repo#456)'
        required: false
        default: ''
      target_repos:
        description: 'Target repositories for scanning (comma-separated, e.g., kubernetes/kubernetes,docker/docker)'
        required: false
        default: 'jreleaser/jreleaser,spring-projects/spring-kafka'
      max_pages:
        description: 'Maximum pages to fetch from GitHub API (1 page = ~100 PRs) - for repo-scan mode'
        required: false
        default: '2'
      dry_run:
        description: 'Dry run mode (true/false)'
        required: false
        default: 'true'
      limit_per_repo:
        description: 'Maximum PRs to process per repository (0 = no limit) - for repo-scan mode'
        required: false
        default: '50'

env:
  GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
  JIRA_AUTH: ${{ secrets.JIRA_AUTH }}

jobs:
  pr-migrate:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests
        
    - name: Run Pull Request Migration
      run: |
        cd scripts
        MODE="${{ github.event.inputs.mode }}"
        SPECIFIC_PRS="${{ github.event.inputs.specific_prs }}"
        MAX_PAGES="${{ github.event.inputs.max_pages }}"
        TARGET_REPOS="${{ github.event.inputs.target_repos }}"
        DRY_RUN="${{ github.event.inputs.dry_run }}"
        LIMIT_PER_REPO="${{ github.event.inputs.limit_per_repo }}"
        
        if [ "$MODE" = "specific-prs" ]; then
          # Use old-issue command for specific PR numbers
          CMD="python github_jira_monitor.py old-issue"
          
          if [ -n "$SPECIFIC_PRS" ]; then
            CMD="$CMD --issues $SPECIFIC_PRS"
          else
            echo "Error: specific_prs input is required for specific-prs mode"
            exit 1
          fi
          
        else
          # Use pr-migrate command for repository scanning
          CMD="python github_jira_monitor.py pr-migrate --max-pages $MAX_PAGES"
          
          # Add repos if specified
          if [ -n "$TARGET_REPOS" ]; then
            CMD="$CMD --repos $TARGET_REPOS"
          fi
          
          # Add limit per repo if specified
          if [ -n "$LIMIT_PER_REPO" ] && [ "$LIMIT_PER_REPO" != "0" ]; then
            CMD="$CMD --limit $LIMIT_PER_REPO"
          fi
        fi
        
        # Add dry run flag if needed
        if [ "$DRY_RUN" = "true" ]; then
          CMD="$CMD --dry-run"
        fi
        
        echo "Running: $CMD"
        eval $CMD
