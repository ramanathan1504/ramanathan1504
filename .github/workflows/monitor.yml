# Name of the GitHub Actions workflow
name: GitHub to Jira Sync Monitor

# Controls when the action will run.
on:
  # 1. Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # 2. Runs the workflow on a schedule
  schedule:
    # This is a CRON string that means "run at the 0, 10, 20, 30, 40, and 50-minute mark of every hour"
    - cron: '*/10 * * * *'

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # The single job in this workflow is called "sync"
  sync:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Step 1: Checks-out your repository under $GITHUB_WORKSPACE, so the job can access it
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Sets up the specific version of Java required by your project
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      # Step 3: Gives the Gradle wrapper executable permissions
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      # Step 4: Builds the application and creates the single, executable "fat JAR"
      - name: Build with Gradle
        run: ./gradlew shadowJar

      # Step 5: Runs the compiled Java application with the correct filename and arguments
      - name: Run GitHub to Jira Sync
        env:
          # These secrets must be configured in your GitHub repository settings
          GH_USER: ${{ secrets.GH_USER }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          JIRA_DOMAIN: ${{ secrets.JIRA_DOMAIN }}
          JIRA_PROJECT: ${{ secrets.JIRA_PROJECT }}
          JIRA_AUTH: ${{ secrets.JIRA_AUTH }}
          SKIP_ORGS: ${{ secrets.SKIP_ORGS }}
        # DEFINITIVE FIX: The filename now correctly includes the version number.
        run: java -jar build/libs/github-jira-monitor-1.0.0-all.jar 10 100 1
