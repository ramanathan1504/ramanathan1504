name: GitHub JIRA Monitor

on:
  schedule:
    # Run every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      since_minutes:
        description: 'Look back this many minutes for comments'
        required: false
        default: '15'
      dry_run:
        description: 'Dry run mode (true/false)'
        required: false
        default: 'false'

env:
  GH_TOKEN: ${{ secrets.GH_TOKEN }}
  JIRA_AUTH: ${{ secrets.JIRA_AUTH }}

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests
        
    - name: Run GitHub JIRA Monitor
      run: |
        cd scripts
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          # Manual trigger with user inputs
          SINCE_MINUTES="${{ github.event.inputs.since_minutes }}"
          DRY_RUN="${{ github.event.inputs.dry_run }}"
          
          if [ "$DRY_RUN" = "true" ]; then
            python github_jira_monitor.py monitor --since-minutes $SINCE_MINUTES --dry-run
          else
            python github_jira_monitor.py monitor --since-minutes $SINCE_MINUTES
          fi
        else
          # Scheduled trigger - use defaults
          python github_jira_monitor.py monitor --since-minutes 15
        fi
