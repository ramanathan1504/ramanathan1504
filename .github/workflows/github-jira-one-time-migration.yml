name: One-Time GitHub JIRA Migration
# This workflow is for initial setup and historical data migration only.
# Once migration is complete, this workflow can be archived or moved.
#
# MIGRATION CAPABILITIES:
# - Migrate historical comments using extended lookback periods
# - Process PRs with extended time windows  
# - Handle old issues with very large lookback periods
#
# IMPORTANT NOTES:
# - This uses the same monitoring script with extended --since-minutes parameters
# - Specific targeting (repos, issue lists) is for documentation - filtering happens in script
# - Always test with dry_run=true first before running actual migration
# - Large migrations may hit API rate limits - monitor workflow logs
#
# This is separate from the ongoing monitoring workflow and should only be run
# during initial setup or for backfilling historical data.

on:
  # Manual execution only - these are one-time operations
  workflow_dispatch:
    inputs:
      operation:
        description: 'Migration operation to perform'
        required: true
        type: choice
        options:
          - migrate
          - pr-migrate
          - old-issue
      # Parameters for migration operations
      max_pages:
        description: 'Approx pages to process (converts to hours lookback: 2hrs/page for migrate, 3hrs/page for PR)'
        required: false
        default: '10'
      # Parameters for PR migration documentation  
      target_repos:
        description: 'Target repos for reference (filtering handled by script logic, e.g., owner/repo1,owner/repo2)'
        required: false
        default: ''
      limit_per_repo:
        description: 'Limit per repo for reference (filtering handled by script logic, 0=no limit)'
        required: false
        default: '0'
      # Parameters for old issue migration documentation
      issue_list:
        description: 'Issues for reference (uses 30-day lookback regardless, e.g., owner/repo#123,owner/repo#456)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run mode (true/false)'
        required: false
        default: 'true'

# Environment variables - same as main monitoring workflow
env:
  GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
  JIRA_AUTH: ${{ secrets.JIRA_AUTH }}

jobs:
  migration:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests
        
    - name: Run One-Time Migration
      run: |
        cd scripts
        
        OPERATION="${{ github.event.inputs.operation }}"
        DRY_RUN="${{ github.event.inputs.dry_run }}"
        
        echo "🔄 One-time migration: Operation=$OPERATION, DryRun=$DRY_RUN"
        
        # Set dry run flag
        DRY_RUN_FLAG=""
        if [ "$DRY_RUN" = "true" ]; then
          DRY_RUN_FLAG="--dry-run"
          echo "🧪 Running in DRY RUN mode"
        fi
        
        # Execute based on operation type
        case "$OPERATION" in
          "migrate")
            MAX_PAGES="${{ github.event.inputs.max_pages }}"
            echo "📚 Running historical comment migration (max $MAX_PAGES pages)..."
            
            # Validate max_pages parameter
            if ! [[ "$MAX_PAGES" =~ ^[0-9]+$ ]] || [ "$MAX_PAGES" -eq 0 ]; then
              echo "❌ Error: max_pages must be a positive integer, got: $MAX_PAGES"
              exit 1
            fi
            
            # Use run_monitor with large lookback for historical migration
            LOOKBACK_HOURS=$((MAX_PAGES * 2))  # Rough estimate: 2 hours per page
            python github_jira_monitor.py --since-minutes $((LOOKBACK_HOURS * 60)) $DRY_RUN_FLAG
            ;;
          "pr-migrate")
            MAX_PAGES="${{ github.event.inputs.max_pages }}"
            TARGET_REPOS="${{ github.event.inputs.target_repos }}"
            LIMIT_PER_REPO="${{ github.event.inputs.limit_per_repo }}"
            
            echo "🔀 Running PR migration..."
            echo "  Max pages: $MAX_PAGES"
            echo "  Target repos: $TARGET_REPOS"
            echo "  Limit per repo: $LIMIT_PER_REPO"
            
            # Validate max_pages parameter
            if ! [[ "$MAX_PAGES" =~ ^[0-9]+$ ]] || [ "$MAX_PAGES" -eq 0 ]; then
              echo "❌ Error: max_pages must be a positive integer, got: $MAX_PAGES"
              exit 1
            fi
            
            # Validate limit_per_repo parameter
            if ! [[ "$LIMIT_PER_REPO" =~ ^[0-9]+$ ]]; then
              echo "❌ Error: limit_per_repo must be a non-negative integer, got: $LIMIT_PER_REPO"
              exit 1
            fi
            
            echo "⚠️  Note: PR migration uses standard monitoring with extended lookback"
            echo "    Target repos and limits are informational - filtering happens in the script"
            
            # Use extended lookback for PR migration
            LOOKBACK_HOURS=$((MAX_PAGES * 3))  # More hours for PR scanning
            python github_jira_monitor.py --since-minutes $((LOOKBACK_HOURS * 60)) $DRY_RUN_FLAG
            ;;
          "old-issue")
            ISSUE_LIST="${{ github.event.inputs.issue_list }}"
            
            if [ -z "$ISSUE_LIST" ]; then
              echo "❌ Error: issue_list parameter is required for old-issue command"
              echo "Example: owner/repo#123,owner/repo#456"
              exit 1
            fi
            
            # Validate issue list format
            if ! [[ "$ISSUE_LIST" =~ ^[a-zA-Z0-9_-]+\/[a-zA-Z0-9_-]+#[0-9]+(,[a-zA-Z0-9_-]+\/[a-zA-Z0-9_-]+#[0-9]+)*$ ]]; then
              echo "❌ Error: Invalid issue list format"
              echo "Expected format: owner/repo#123,owner/repo#456"
              echo "Got: $ISSUE_LIST"
              exit 1
            fi
            
            echo "📋 Running old issue migration..."
            echo "  Issues: $ISSUE_LIST"
            
            echo "⚠️  Note: Old issue migration requires manual processing"
            echo "    This workflow will run with extended lookback to capture historical data"
            echo "    Specific issue processing: $ISSUE_LIST"
            
            # Use very large lookback for old issues (30 days)
            python github_jira_monitor.py --since-minutes 43200 $DRY_RUN_FLAG
            ;;
          *)
            echo "❌ Unknown operation: $OPERATION"
            exit 1
            ;;
        esac
