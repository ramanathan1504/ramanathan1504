# Enhanced GitHub JIRA Monitor Workflow
# This workflow automatically monitors GitHub for comprehensive contribution tracking:
# - Comments on issues/PRs (IssueCommentEvent)
# - Code review comments (PullRequestReviewCommentEvent)  
# - New PRs you create (PullRequestEvent - opened)
# - New issues you create (IssuesEvent - opened)
# - Author detection for PRs/issues (even without comments)
# It supports both scheduled runs and manual triggers with custom parameters
name: Enhanced GitHub JIRA Monitor

on:
  # Scheduled execution - runs automatically every 10 minutes
  schedule:
    # Cron syntax: minute hour day month day-of-week
    # */10 = every 10 minutes, * = any hour/day/month/weekday
    - cron: '*/10 * * * *'
  
  # Manual execution - allows running the workflow with custom parameters
  workflow_dispatch:
    inputs:
      since_minutes:
        description: 'Look back this many minutes for comments and authorship events'
        required: false
        default: '15'  # Default: check last 15 minutes of activity
      dry_run:
        description: 'Dry run mode (true/false)'
        required: false
        default: 'false'  # Default: actually create JIRA tasks

# Environment variables - these secrets must be configured in GitHub repository settings
env:
  # GitHub personal access token for API access
  # Secret name: GH_TOKEN (configured in repository settings > Secrets and variables > Actions)
  GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
  
  # JIRA authentication token (base64 encoded username:password or API token)
  # Secret name: JIRA_AUTH (configured in repository settings > Secrets and variables > Actions)
  JIRA_AUTH: ${{ secrets.JIRA_AUTH }}

jobs:
  # Main job that runs the GitHub-JIRA monitoring script
  monitor:
    runs-on: ubuntu-latest  # Use latest Ubuntu runner
    steps:
    # Step 1: Download the repository code to the runner
    - name: Checkout repository
      uses: actions/checkout@v4  # Official GitHub action to checkout code
      
    # Step 2: Set up Python environment for running our monitoring script
    - name: Set up Python
      uses: actions/setup-python@v4  # Official GitHub action for Python setup
      with:
        python-version: '3.9'  # Use Python 3.9 for compatibility
        
    # Step 3: Install required Python packages
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip  # Upgrade pip to latest version
        pip install requests  # Install requests library for HTTP API calls
        
    # Step 4: Execute the main monitoring script with appropriate parameters
    - name: Run GitHub JIRA Monitor
      run: |
        cd scripts  # Navigate to scripts directory
        
        # Check how the workflow was triggered and set parameters accordingly
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          # Manual trigger - use user-provided inputs
          SINCE_MINUTES="${{ github.event.inputs.since_minutes }}"
          DRY_RUN="${{ github.event.inputs.dry_run }}"
          
          # Execute with dry-run flag if requested
          if [ "$DRY_RUN" = "true" ]; then
            # Dry run mode: test without creating actual JIRA tasks
            python github_jira_monitor.py monitor --since-minutes $SINCE_MINUTES --dry-run
          else
            # Normal mode: create actual JIRA tasks
            python github_jira_monitor.py monitor --since-minutes $SINCE_MINUTES
          fi
        else
          # Scheduled trigger - use default parameters
          # Check last 15 minutes for comments, reviews, and new PRs/issues
          python github_jira_monitor.py monitor --since-minutes 15
        fi
