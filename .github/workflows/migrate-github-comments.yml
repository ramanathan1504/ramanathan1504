name: Migrate All GitHub Comments to JIRA

on:
  workflow_dispatch:  # Manual trigger only
    inputs:
      max_pages:
        description: 'Maximum pages to process (each page = 100 events)'
        required: false
        default: '10'
        type: string
      dry_run:
        description: 'Dry run (show what would be processed without creating JIRA tasks)'
        required: false
        default: false
        type: boolean

jobs:
  migrate-all-comments:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      
      - name: Migrate All Historical Comments
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python scripts/github_jira_monitor.py migrate --max-pages ${{ github.event.inputs.max_pages }} --dry-run
          else
            python scripts/github_jira_monitor.py migrate --max-pages ${{ github.event.inputs.max_pages }}
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          JIRA_AUTH: ${{ secrets.JIRA_AUTH }}
