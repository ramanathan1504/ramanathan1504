name: One-Time GitHub JIRA Migration
# This workflow is for initial setup and historical data migration only.
# Once migration is complete, this workflow can be archived or moved.
#
# MIGRATION CAPABILITIES:
# - Migrate historical comments from GitHub events
# - Migrate PRs from specific repositories  
# - Migrate specific old issues by issue numbers
#
# This is separate from the ongoing monitoring workflow and should only be run
# during initial setup or for backfilling historical data.

on:
  # Manual execution only - these are one-time operations
  workflow_dispatch:
    inputs:
      operation:
        description: 'Migration operation to perform'
        required: true
        type: choice
        options:
          - migrate
          - pr-migrate
          - old-issue
      # Parameters for 'migrate' command
      max_pages:
        description: 'Max pages to process (migrate/pr-migrate only)'
        required: false
        default: '10'
      # Parameters for 'pr-migrate' command  
      target_repos:
        description: 'Comma-separated repos (pr-migrate only, e.g., owner/repo1,owner/repo2)'
        required: false
        default: ''
      limit_per_repo:
        description: 'Limit PRs per repo (pr-migrate only, 0=no limit)'
        required: false
        default: '0'
      # Parameters for 'old-issue' command
      issue_list:
        description: 'Comma-separated issues (old-issue only, e.g., owner/repo#123,owner/repo#456)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run mode (true/false)'
        required: false
        default: 'true'

# Environment variables - same as main monitoring workflow
env:
  GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
  JIRA_AUTH: ${{ secrets.JIRA_AUTH }}

jobs:
  migration:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests
        
    - name: Run One-Time Migration
      run: |
        cd scripts
        
        OPERATION="${{ github.event.inputs.operation }}"
        DRY_RUN="${{ github.event.inputs.dry_run }}"
        
        echo "🔄 One-time migration: Operation=$OPERATION, DryRun=$DRY_RUN"
        
        # Set dry run flag
        DRY_RUN_FLAG=""
        if [ "$DRY_RUN" = "true" ]; then
          DRY_RUN_FLAG="--dry-run"
          echo "🧪 Running in DRY RUN mode"
        fi
        
        # Execute based on operation type
        case "$OPERATION" in
          "migrate")
            MAX_PAGES="${{ github.event.inputs.max_pages }}"
            echo "📚 Running historical comment migration (max $MAX_PAGES pages)..."
            python github_jira_monitor.py migrate --max-pages $MAX_PAGES $DRY_RUN_FLAG
            ;;
          "pr-migrate")
            MAX_PAGES="${{ github.event.inputs.max_pages }}"
            TARGET_REPOS="${{ github.event.inputs.target_repos }}"
            LIMIT_PER_REPO="${{ github.event.inputs.limit_per_repo }}"
            
            echo "🔀 Running PR migration..."
            echo "  Max pages: $MAX_PAGES"
            echo "  Target repos: $TARGET_REPOS"
            echo "  Limit per repo: $LIMIT_PER_REPO"
            
            REPO_FLAG=""
            if [ -n "$TARGET_REPOS" ]; then
              REPO_FLAG="--repos $TARGET_REPOS"
            fi
            
            LIMIT_FLAG=""
            if [ "$LIMIT_PER_REPO" != "0" ]; then
              LIMIT_FLAG="--limit $LIMIT_PER_REPO"
            fi
            
            python github_jira_monitor.py pr-migrate --max-pages $MAX_PAGES $REPO_FLAG $LIMIT_FLAG $DRY_RUN_FLAG
            ;;
          "old-issue")
            ISSUE_LIST="${{ github.event.inputs.issue_list }}"
            
            if [ -z "$ISSUE_LIST" ]; then
              echo "❌ Error: issue_list parameter is required for old-issue command"
              echo "Example: owner/repo#123,owner/repo#456"
              exit 1
            fi
            
            echo "📋 Running old issue migration..."
            echo "  Issues: $ISSUE_LIST"
            
            python github_jira_monitor.py old-issue --issues "$ISSUE_LIST" $DRY_RUN_FLAG
            ;;
          *)
            echo "❌ Unknown operation: $OPERATION"
            exit 1
            ;;
        esac
