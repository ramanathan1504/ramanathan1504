name: Ongoing GitHub JIRA Monitor
# This workflow handles ongoing monitoring and lifecycle tracking.
# For one-time migrations, use the separate github-jira-one-time-migration.yml workflow.
#
# ONGOING MONITORING CAPABILITIES:
# - Comments on issues/PRs (IssueCommentEvent) 
# - Code review comments (PullRequestReviewCommentEvent)
# - New PRs you create (PullRequestEvent - opened)
# - New issues you create (IssuesEvent - opened)
# - Push events for In Progress status tracking
# - Author detection for PRs/issues (even without comments)
# - Mention detection (@ramanathan1504) with smart status assignment
# - Fork repository detection for intelligent status flow
#
# RELEASE TRACKING:
# - Automatic Done → Released status transitions
# - Release tag monitoring
# - Merged PR release detection
#
# STATUS FLOW:
# Discussion → Todo → In Progress → Pull Request → Done → Released
#
# Runs automatically on schedule with manual trigger options

on:
  # Scheduled execution - runs automatically every 10 minutes for monitoring
  # and every hour for release checking
  schedule:
    # Main monitoring: every 10 minutes
    - cron: '*/10 * * * *'
    # Release checking: every hour at minute 0
    - cron: '0 * * * *'
  
  # Manual execution - allows running the workflow with custom parameters
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode (true/false)'
        required: false
        default: 'false'
      since_minutes:
        description: 'Look back this many minutes for events (leave blank for full run, or set for time-based run)'
        required: false
        default: ''

# Environment variables - these secrets must be configured in GitHub repository settings
env:
  # GitHub configuration
  # Secret name: GH_USER (configured in repository settings > Secrets and variables > Actions)
  GH_USER: ${{ secrets.GH_USER }}
  # Secret name: GH_TOKEN (configured in repository settings > Secrets and variables > Actions)
  GH_TOKEN: ${{ secrets.GH_TOKEN }}
  
  # JIRA configuration
  # Secret name: JIRA_DOMAIN (configured in repository settings > Secrets and variables > Actions)
  JIRA_DOMAIN: ${{ secrets.JIRA_DOMAIN }}
  # Secret name: JIRA_PROJECT (configured in repository settings > Secrets and variables > Actions)  
  JIRA_PROJECT: ${{ secrets.JIRA_PROJECT }}
  # Secret name: JIRA_AUTH (configured in repository settings > Secrets and variables > Actions)
  JIRA_AUTH: ${{ secrets.JIRA_AUTH }}
  
  # Optional: Organizations to skip (comma-separated)
  # Secret name: SKIP_ORGS (configured in repository settings > Secrets and variables > Actions)
  SKIP_ORGS: ${{ secrets.SKIP_ORGS }}

jobs:
  # Main job that runs the comprehensive GitHub-JIRA monitoring and release checking
  comprehensive_monitor:
    runs-on: ubuntu-latest
    steps:
    # Step 1: Download the repository code to the runner
    - name: Checkout repository
      uses: actions/checkout@v4
      
    # Step 2: Set up Python environment for running our monitoring script
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    # Step 3: Install required Python packages
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests python-dotenv
        
    # Step 4: Execute core workflow in one of three modes: dry run, time-based, or full run
    - name: Run GitHub JIRA Core Workflow
      run: |
        cd scripts
        # Manual trigger: use workflow_dispatch inputs
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          DRY_RUN="${{ github.event.inputs.dry_run }}"
          SINCE_MINUTES="${{ github.event.inputs.since_minutes }}"
          DRY_RUN_FLAG=""
          SINCE_FLAG=""
          if [ "$DRY_RUN" = "true" ]; then
            DRY_RUN_FLAG="--dry_run True"
            echo "🧪 Running in DRY RUN mode"
          fi
          if [ -n "$SINCE_MINUTES" ]; then
            SINCE_FLAG="--since_minutes $SINCE_MINUTES"
            echo "⏰ Running in TIME-BASED mode (last $SINCE_MINUTES min)"
          fi
          if [ -n "$DRY_RUN_FLAG" ]; then
            python monitor_v1.py $DRY_RUN_FLAG
          elif [ -n "$SINCE_FLAG" ]; then
            python monitor_v1.py $SINCE_FLAG
          else
            python monitor_v1.py
          fi
        else
          # Scheduled trigger: always run time-based (last 10 min)
          echo "⏰ Scheduled trigger: Running time-based (last 10 min)"
          python monitor_v1.py --since_minutes 10
        fi
