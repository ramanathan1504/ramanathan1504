name: GitHub to Jira Sync Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build with Gradle
        # DEFINITIVE FIX: Use the correct command for a multi-project build
        run: ./gradlew :app:shadowJar

      - name: List built files for debugging
        run: ls -R app/build/libs

      - name: Run GitHub to Jira Sync
        env:
          GH_USER: ${{ secrets.GH_USER }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          JIRA_DOMAIN: ${{ secrets.JIRA_DOMAIN }}
          JIRA_PROJECT: ${{ secrets.JIRA_PROJECT }}
          JIRA_AUTH: ${{ secrets.JIRA_AUTH }}
          SKIP_ORGS: ${{ secrets.SKIP_ORGS }}
        # DEFINITIVE FIX: Use the correct path to the JAR file
        run: java -jar app/build/libs/github-jira-monitor-*-all.jar 10 100 1